[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sdk"
version = "0.1.0"
description = "Lightweight telemetry SDK for Sentinel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110.0"]

[tool.hatch.build.targets.wheel]
packages = ["sentinel_sdk"]
